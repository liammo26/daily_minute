<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1c1f">
<title>The Daily Minute</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>
  /* Apply saved theme before first paint (no light-mode flash) */
  try {
    if (localStorage.getItem("dashboard_theme") === "light") {
      document.documentElement.setAttribute("data-theme", "light");
      document.querySelector('meta[name="theme-color"]').setAttribute("content", "#e8eaec");
    }
  } catch (e) {}
</script>
<style>
  /* Field notebook: ruled rows, square edges, one ink colour, mono for anything measured.
     Interaction grammar: → moves within the app, ↗ opens another site, a square box toggles. */
  :root {
    /* Graphite (default) */
    --bg: #1a1c1f;
    --surface: #222529;
    --ink: #e3e5e8;
    --muted: #8a919b;
    --rule: #30343a;
    --rule-strong: #4a5059;
    --accent: #93b4e0;      /* ink blue, lifted for dark */
    --on-accent: #10161f;

    /* Section markers — muted, only ever a small square or an underline */
    --news: #c4605a;
    --weather: #6f9cc4;
    --cal: #6aa37f;

    --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  [data-theme="light"] {
    /* Paper grey */
    --bg: #e8eaec;
    --surface: #f3f4f5;
    --ink: #18202b;
    --muted: #5a6370;
    --rule: #c7ccd3;
    --rule-strong: #9aa2ad;
    --accent: #1f4b86;
    --on-accent: #f3f4f5;

    --news: #a23b35;
    --weather: #2f6496;
    --cal: #2f6d48;
    color-scheme: light;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--font-body);
    font-size: 15px;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.4;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .muted { color: var(--muted); }

  /* ---------- Top bar (header + tabs pinned together) ---------- */
  .top-bar { position: sticky; top: 0; z-index: 20; background: var(--bg); }
  header { padding: 14px 16px 10px; max-width: 620px; margin: 0 auto; }
  .head-row { display: flex; align-items: center; gap: 12px; }
  h1 { font-size: 1rem; font-weight: 600; flex: 1; min-width: 0; }
  h1 .wk { font-family: var(--font-mono); font-weight: 400; font-size: .72rem; color: var(--muted); margin-left: 8px; letter-spacing: .04em; }
  .icon-btn {
    width: 32px; height: 32px; flex-shrink: 0;
    background: transparent; border: 1px solid var(--rule-strong); border-radius: 0;
    font-size: .95rem; line-height: 1; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { background: var(--surface); }
  .half { width: 12px; height: 12px; border: 1.5px solid var(--ink); background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); }
  .quote { margin-top: 6px; font-size: .8rem; color: var(--muted); font-style: italic; line-height: 1.45; }
  .quote b { color: var(--ink); font-style: normal; font-weight: 500; }
  .quote a { color: var(--muted); text-decoration: none; font-style: normal; opacity: .6; }

  nav {
    display: flex; gap: 20px; overflow-x: auto; padding: 0 16px;
    border-bottom: 1px solid var(--rule); scrollbar-width: none;
    max-width: 620px; margin: 0 auto;
  }
  nav::-webkit-scrollbar { display: none; }
  .tab {
    white-space: nowrap; padding: 10px 0 9px; background: none; border: 0;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    color: var(--muted); font-size: .88rem; font-weight: 500; cursor: pointer; flex-shrink: 0;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--mark); }

  /* One marker colour per area, used by its tab, its section and its Today window */
  [data-area="today"]    { --mark: var(--ink); }
  [data-area="habits"]   { --mark: var(--accent); }
  [data-area="calendar"] { --mark: var(--cal); }
  [data-area="weather"]  { --mark: var(--weather); }
  [data-area="news"]     { --mark: var(--news); }

  /* ---------- Sections ---------- */
  main { padding: 0 16px 48px; max-width: 620px; margin: 0 auto; }
  section { display: none; }
  section.active { display: block; }

  /* Head line: the same component heads every tab and every Today window */
  .head-line {
    display: flex; align-items: center; gap: 10px; width: 100%;
    font-family: var(--font-mono); font-size: .7rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; text-align: left;
    padding: 12px 0 10px; border: 0; border-bottom: 1px solid var(--rule); background: none;
  }
  .head-line .label { flex: 1; min-width: 0; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head-line .mark { display: inline-block; width: 7px; height: 7px; background: var(--mark); margin-right: 8px; vertical-align: 1px; }
  .head-line .sum { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .head-line .go { color: var(--ink); font-size: .85rem; margin-left: 2px; }
  button.head-line { cursor: pointer; }
  button.head-line:active { background: var(--surface); }

  .window + .window { margin-top: 26px; }
  .window .head-line { border-top: 1px solid var(--rule-strong); }
  .window:first-child .head-line { border-top: 0; }

  .sub-label {
    display: flex; justify-content: space-between; gap: 12px;
    font-family: var(--font-mono); font-size: .68rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em;
    padding: 20px 0 6px; border-bottom: 1px solid var(--rule);
  }
  .sub-label a { color: var(--muted); text-decoration: none; }
  .sub-label a:active { color: var(--ink); }

  /* ---------- Rows (news) ---------- */
  .row {
    display: flex; gap: 12px; align-items: flex-start; text-decoration: none; color: inherit;
    padding: 11px 0; border-bottom: 1px solid var(--rule);
  }
  .row:active { background: var(--surface); }
  .row-body { flex: 1; min-width: 0; }
  .row-title { font-size: .95rem; font-weight: 500; line-height: 1.35; }
  .row-time { font-family: var(--font-mono); font-size: .7rem; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .ext { color: var(--muted); font-size: .8rem; padding-top: 2px; }

  /* Action row: an in-app next step inside a window */
  .action {
    display: flex; justify-content: space-between; width: 100%; text-align: left;
    padding: 12px 0; border: 0; border-bottom: 1px solid var(--rule); background: none;
    font-size: .9rem; cursor: pointer;
  }
  .action:active { background: var(--surface); }

  /* ---------- Weather ---------- */
  .wx-now { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 0 12px; }
  .wx-temp { font-family: var(--font-mono); font-size: 2.6rem; line-height: 1; letter-spacing: -.02em; }
  .wx-now.compact { padding: 12px 0 10px; }
  .wx-now.compact .wx-temp { font-size: 1.7rem; }
  .wx-desc { color: var(--muted); font-size: .88rem; margin-top: 6px; }
  .wx-icon { font-size: 2.2rem; line-height: 1; }
  .wx-now.compact .wx-icon { font-size: 1.6rem; }
  .wx-stats {
    display: flex; gap: 18px; flex-wrap: wrap; padding: 10px 0;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    font-size: .82rem; color: var(--muted);
  }
  .wx-stats b { font-family: var(--font-mono); color: var(--ink); font-weight: 500; }

  .strip { display: grid; grid-template-columns: repeat(6, 1fr); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .strip > div { padding: 8px 0; text-align: center; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .strip > div + div { border-left: 1px solid var(--rule); }
  .strip .h { font-size: .66rem; color: var(--muted); letter-spacing: .04em; }
  .strip .e { font-size: 1.05rem; line-height: 1.5; }
  .strip .t { font-size: .85rem; }
  .strip .r { font-size: .66rem; color: var(--muted); }
  .strip .past { opacity: .4; }
  .strip .cur { box-shadow: inset 0 2px 0 var(--ink); }
  .strip .cur .h { color: var(--ink); }

  .daylight { padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .dl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .dl-value { font-family: var(--font-mono); font-size: 1.05rem; }
  .dl-note { font-size: .82rem; color: var(--muted); }
  .dl-bar { position: relative; height: 6px; margin-top: 10px; border: 1px solid var(--rule-strong); }
  .dl-bar .elapsed { position: absolute; inset: 0 auto 0 0; background: var(--rule-strong); }
  .dl-bar .now { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
  .dl-ends { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: .7rem; color: var(--muted); margin-top: 6px; }

  .table-wrap { overflow-x: auto; }
  table.wx { width: 100%; border-collapse: collapse; font-size: .86rem; font-variant-numeric: tabular-nums; }
  table.wx th {
    text-align: left; color: var(--muted); font-weight: 400; padding: 8px 4px 6px;
    font-family: var(--font-mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .06em;
    border-bottom: 1px solid var(--rule);
  }
  table.wx td { padding: 8px 4px; border-bottom: 1px solid var(--rule); font-family: var(--font-mono); }
  table.wx td:first-child { font-family: var(--font-body); }
  table.wx th:last-child, table.wx td:last-child { text-align: right; }
  .wx-em { font-size: 1.05rem; }
  .lo { color: var(--muted); }

  /* ---------- Calendar ---------- */
  .cal-day {
    font-family: var(--font-mono); font-size: .7rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em;
    padding: 18px 0 6px; border-bottom: 1px solid var(--rule);
  }
  .event { display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .event-time { font-family: var(--font-mono); font-size: .8rem; min-width: 54px; padding-top: 1px; font-variant-numeric: tabular-nums; }
  .event-title { font-size: .92rem; min-width: 0; }
  .event.past { color: var(--muted); }
  .event.past .event-title { text-decoration: line-through; text-decoration-color: var(--rule-strong); }
  .note { padding: 12px 0; font-size: .88rem; color: var(--muted); border-bottom: 1px solid var(--rule); }
  .cal-form { padding: 16px 0; display: grid; gap: 10px; }
  .cal-form p { font-size: .88rem; color: var(--muted); }
  .cal-form details { font-size: .84rem; color: var(--muted); }
  .cal-form summary { cursor: pointer; color: var(--ink); }
  .cal-form details div { padding: 8px 0 0; line-height: 1.5; }
  .field {
    width: 100%; padding: 10px; border: 1px solid var(--rule-strong); border-radius: 0;
    background: var(--surface); color: var(--ink); font-family: var(--font-mono); font-size: .8rem;
  }
  .btn-row { display: flex; gap: 8px; }
  .btn {
    padding: 10px 14px; border-radius: 0; border: 1px solid var(--accent);
    background: var(--accent); color: var(--on-accent); font-weight: 500; font-size: .86rem; cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule-strong); }
  .btn:active { opacity: .85; }
  .text-link { background: none; border: 0; color: var(--muted); font-size: .8rem; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 16px 0 0; }

  /* ---------- Habits (same row on the Habits tab and on Today) ---------- */
  .habit { border-bottom: 1px solid var(--rule); }
  .habit-top {
    display: flex; align-items: center; gap: 12px; padding: 12px 0;
    cursor: pointer; user-select: none;
  }
  .habit-top:active { background: var(--surface); }
  .habits-full .habit-top { padding-bottom: 8px; }
  .check {
    width: 26px; height: 26px; flex-shrink: 0; border-radius: 0;
    border: 1.5px solid var(--rule-strong); background: transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: .95rem; color: transparent; pointer-events: none;
  }
  .habit.done .check { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .habit-name { flex: 1; min-width: 0; font-size: .96rem; font-weight: 500; }
  .habit.done .habit-name { color: var(--muted); }
  .habit-streak { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .habit-streak.on { color: var(--ink); }
  .del { background: none; border: none; color: var(--muted); font-size: .9rem; cursor: pointer; padding: 4px 2px 4px 8px; opacity: .55; }
  .del:active { opacity: 1; }
  .grid { display: grid; grid-template-columns: repeat(28, 1fr); gap: 2px; margin: 0 0 12px 38px; max-width: 420px; }
  .cell { aspect-ratio: 1; max-width: 100%; border: 1px solid var(--rule); }
  .cell.on { background: var(--ink); border-color: var(--ink); opacity: .82; }
  .cell.today { outline: 1px solid var(--accent); outline-offset: 1px; }
  .add-row { display: flex; gap: 8px; padding-top: 14px; }
  .add-row input {
    flex: 1; min-width: 0; padding: 10px 0; border: 0; border-bottom: 1px solid var(--rule-strong); border-radius: 0;
    background: transparent; color: var(--ink); font-family: var(--font-body); font-size: .92rem;
  }
  .add-row input:focus { outline: none; border-bottom-color: var(--accent); }
  .add-row input::placeholder { color: var(--muted); }

  /* ---------- Loading / errors ---------- */
  .loading { padding: 14px 0; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); border-bottom: 1px solid var(--rule); }
  .loading::after {
    content: ""; display: block; height: 1px; margin-top: 10px; background: var(--rule-strong);
    transform-origin: left; animation: load 1.2s ease-in-out infinite;
  }
  @keyframes load { 0% { transform: scaleX(0); } 60% { transform: scaleX(1); } 100% { transform: scaleX(1); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .loading::after { animation: none; } }
  .error { padding: 12px 0; color: var(--muted); font-size: .88rem; border-bottom: 1px solid var(--rule); }
  .error a { color: var(--ink); }
</style>
</head>
<body>
<div class="top-bar">
<header>
  <div class="head-row">
    <h1><span id="date"></span><span class="wk" id="week"></span></h1>
    <button class="icon-btn" id="refresh" aria-label="Refresh" title="Refresh">↻</button>
    <button class="icon-btn" id="theme-toggle" aria-label="Switch theme" title="Switch theme"><span class="half"></span></button>
  </div>
  <div class="quote" id="quote"></div>
</header>

<nav id="tabs">
  <button class="tab active" data-tab="today"    data-area="today">Today</button>
  <button class="tab"        data-tab="habits"   data-area="habits">Habits</button>
  <button class="tab"        data-tab="calendar" data-area="calendar">Calendar</button>
  <button class="tab"        data-tab="weather"  data-area="weather">Weather</button>
  <button class="tab"        data-tab="news"     data-area="news">News</button>
</nav>
</div>

<main>
  <!-- TODAY: one window per tab, in tab order. Head opens the tab; rows act in place. -->
  <section class="active" id="today" data-area="today">
    <div class="window" data-area="habits">
      <button class="head-line" data-goto="habits"><span class="label"><span class="mark"></span>Habits</span><span class="sum" id="ov-hb-sum"></span><span class="go">→</span></button>
      <div id="ov-habits"></div>
    </div>
    <div class="window" data-area="calendar">
      <button class="head-line" data-goto="calendar"><span class="label"><span class="mark"></span>Calendar · Today</span><span class="sum" id="ov-cal-sum"></span><span class="go">→</span></button>
      <div id="ov-cal"><div class="loading">Loading</div></div>
    </div>
    <div class="window" data-area="weather">
      <button class="head-line" data-goto="weather"><span class="label"><span class="mark"></span>Weather · Today</span><span class="sum" id="ov-wx-sum"></span><span class="go">→</span></button>
      <div id="ov-wx"><div class="loading">Loading</div></div>
    </div>
    <div class="window" data-area="news">
      <button class="head-line" data-goto="news"><span class="label"><span class="mark"></span>News · Top stories</span><span class="sum" id="ov-news-sum"></span><span class="go">→</span></button>
      <div id="ov-news"><div class="loading">Loading</div></div>
    </div>
  </section>

  <section id="habits" data-area="habits">
    <div class="head-line"><span class="label"><span class="mark"></span>Habits</span><span class="sum" id="hb-summary"></span></div>
    <div id="hb-list" class="habits-full"></div>
    <div class="add-row">
      <input id="hb-new" type="text" placeholder="New habit" maxlength="40" />
      <button class="btn" id="hb-add">Add</button>
    </div>
  </section>

  <section id="calendar" data-area="calendar">
    <div class="head-line"><span class="label"><span class="mark"></span>Calendar · 14 days</span><span class="sum" id="cal-count"></span></div>
    <div id="cal"></div>
  </section>

  <section id="weather" data-area="weather">
    <div class="head-line"><span class="label"><span class="mark"></span>Weather · <span id="wx-place"></span></span><span class="sum" id="wx-coords"></span></div>
    <div id="wx"><div class="loading">Loading</div></div>
  </section>

  <section id="news" data-area="news">
    <div class="head-line"><span class="label"><span class="mark"></span>News · Top stories</span><span class="sum" id="news-stamp"></span></div>
    <div id="news-feed"></div>
  </section>
</main>

<script>
/* ============ CONFIG ============ */
const FEEDS = {
  bbc:   { name: "BBC News",   url: "https://feeds.bbci.co.uk/news/rss.xml",     site: "https://www.bbc.co.uk/news" },
  sport: { name: "BBC Sport",  url: "https://feeds.bbci.co.uk/sport/rss.xml",    site: "https://www.bbc.co.uk/sport" },
  ajz:   { name: "Al Jazeera", url: "https://www.aljazeera.com/xml/rss/all.xml", site: "https://www.aljazeera.com" }
};
const NEWS_PER_SOURCE = 3;
// Location — change these three if you move
const PLACE = "Edinburgh";
const LAT = 55.9533, LON = -3.1883;
// News comes from rss2json first (fast, returns JSON). These CORS proxies are the fallback,
// and the calendar's only route. "text" = raw body; "wrapped" = {contents: "..."}, which
// allorigins sometimes returns as a base64 data: URI — readProxy() handles both.
// (corsproxy.io now requires a paid key; thingproxy is gone — both removed Oct 2026.)
const RSS2JSON = u => `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(u)}`;
const CORS_PROXIES = [
  { build: u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,   mode: "text" },
  { build: u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,   mode: "wrapped" },
  { build: u => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`, mode: "text" }
];

/* ============ THEME ============ */
const THEME_KEY = "dashboard_theme";
function applyTheme(mode) {
  const meta = document.querySelector('meta[name="theme-color"]');
  if (mode === "light") {
    document.documentElement.setAttribute("data-theme", "light");
    meta.setAttribute("content", "#e8eaec");
  } else {
    document.documentElement.removeAttribute("data-theme");
    meta.setAttribute("content", "#1a1c1f");
  }
}
let currentTheme;
try { currentTheme = localStorage.getItem(THEME_KEY) || "dark"; } catch (e) { currentTheme = "dark"; }
applyTheme(currentTheme);
document.getElementById("theme-toggle").addEventListener("click", () => {
  currentTheme = currentTheme === "light" ? "dark" : "light";
  try { localStorage.setItem(THEME_KEY, currentTheme); } catch (e) {}
  applyTheme(currentTheme);
});

/* ============ HELPERS ============ */
const $ = id => document.getElementById(id);
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hhmm(d) { return d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }); }
function timeAgo(dateStr) {
  const d = new Date(dateStr); if (isNaN(d)) return "";
  const mins = Math.floor((Date.now() - d) / 60000);
  if (mins < 1) return "now";
  if (mins < 60) return mins + "m";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h";
  return Math.floor(hrs / 24) + "d";
}
function stripHtml(s) { const t = document.createElement("div"); t.innerHTML = s || ""; return t.textContent.trim(); }
function fetchWithTimeout(u, ms = 8000, opts = {}) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  return fetch(u, { ...opts, signal: ctrl.signal }).finally(() => clearTimeout(t));
}
const LOADING = `<div class="loading">Loading</div>`;
async function readProxy(r, mode) {
  if (mode !== "wrapped") return r.text();
  const c = (await r.json()).contents || "";
  const m = c.match(/^data:[^,]*;base64,(.*)$/s);
  if (!m) return c;
  return new TextDecoder().decode(Uint8Array.from(atob(m[1]), ch => ch.charCodeAt(0)));
}
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}

async function loadQuote() {
  const todayKey = new Date().toDateString();
  try {
    const cached = JSON.parse(localStorage.getItem("daily_quote") || "null");
    if (cached && cached.day === todayKey) { renderQuote(cached.q, cached.a); return; }
  } catch (e) {}
  const [fq, fa] = FALLBACK_QUOTES[Math.floor(Date.now() / 864e5) % FALLBACK_QUOTES.length];
  renderQuote(fq, fa);
  const api = "https://zenquotes.io/api/today";
  const tryParse = raw => {
    const arr = JSON.parse(raw);
    if (Array.isArray(arr) && arr[0] && arr[0].q) return [arr[0].q.trim(), arr[0].a || "Unknown"];
    return null;
  };
  const attempts = [
    () => fetchWithTimeout(api, 6000).then(r => r.text()),
    ...CORS_PROXIES.map(p => () => fetchWithTimeout(p.build(api), 6000)
      .then(r => readProxy(r, p.mode)))
  ];
  for (const attempt of attempts) {
    try {
      const parsed = tryParse(await attempt());
      if (parsed) {
        renderQuote(parsed[0], parsed[1]);
        try { localStorage.setItem("daily_quote", JSON.stringify({ day: todayKey, q: parsed[0], a: parsed[1] })); } catch (e) {}

const TAB_ORDER = ["today", "habits", "calendar", "weather", "news"];
function activateTab(name) {
  const btn = document.querySelector(`.tab[data-tab="${name}"]`);
  const sec = $(name);
  if (!btn || !sec) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === btn));

function moveTab(dir) {
  const active = document.querySelector(".tab.active");
  const i = active ? TAB_ORDER.indexOf(active.dataset.tab) : 0;

  activateTab(TAB_ORDER[(i + dir + n) % n]);

// Swipe left/right between tabs (wraps)
(function () {
  let startX = 0, startY = 0, tracking = false;
  const THRESHOLD = 55;
  const main = document.querySelector("main");
  main.addEventListener("touchstart", e => {
    if (e.touches.length !== 1 || e.target.closest("nav, table, input")) { tracking = false; return; }
    startX = e.touches[0].clientX; startY = e.touches[0].clientY; tracking = true;
  }, { passive: true });
  main.addEventListener("touchend", e => {
    if (!tracking) return;
    tracking = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) < THRESHOLD || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    moveTab(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

const news = {};   // key -> { items } | { error: true }

function parseFeedXml(xmlText) {
  const xml = new DOMParser().parseFromString(xmlText, "text/xml");
  if (xml.querySelector("parsererror")) throw new Error("bad xml");
  let nodes = [...xml.querySelectorAll("item")];
  if (!nodes.length) nodes = [...xml.querySelectorAll("entry")];
  if (!nodes.length) throw new Error("no items");
  return nodes.slice(0, 15).map(it => {
    const get = tag => it.querySelector(tag)?.textContent?.trim() || "";
    let link = get("link");
    if (!link) link = it.querySelector("link")?.getAttribute("href") || "";
    return { title: stripHtml(get("title")), link, date: get("pubDate") || get("published") || get("updated") };
  });
}
async function fetchFeed(url) {
  let lastErr;
  try {
    const r = await fetchWithTimeout(RSS2JSON(url), 8000);
    const j = await r.json();
    if (j.status === "ok" && j.items && j.items.length) {
      return j.items.map(it => ({
        title: stripHtml(it.title),
        link: it.link,
        // rss2json gives "YYYY-MM-DD HH:MM:SS" in UTC
        date: it.pubDate ? it.pubDate.replace(" ", "T") + "Z" : ""
      }));
    }
    lastErr = new Error(j.message || "rss2json empty");
  } catch (e) { lastErr = e; }
  for (const p of CORS_PROXIES) {
    try {
      const r = await fetchWithTimeout(p.build(url));
      if (!r.ok) { lastErr = new Error("HTTP " + r.status); continue; }
      const xmlText = await readProxy(r, p.mode);
      if (!xmlText || xmlText.length < 100) { lastErr = new Error("empty"); continue; }
      const items = parseFeedXml(xmlText);
      if (items.length) return items;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error("all proxies failed");
}
function newsRow(it, sourceName) {
  const meta = [sourceName, timeAgo(it.date)].filter(Boolean).join(" · ");
  return `<a class="row" href="${esc(it.link)}" target="_blank" rel="noopener">
      <div class="row-body"><div class="row-title">${esc(it.title)}</div>${meta ? `<div class="row-time">${esc(meta)}</div>` : ""}</div>
      <span class="ext" aria-hidden="true">↗</span>
    </a>`;
}
function renderNews() {
  const keys = Object.keys(FEEDS);
  // Full tab: a block per source
  $("news-feed").innerHTML = keys.map(k => {
    const f = FEEDS[k], s = news[k];
    let body;
    if (!s) body = LOADING;
    else if (s.error) body = `<div class="error">Didn't load. Tap ↻ to retry.</div>`;
    else body = s.items.slice(0, NEWS_PER_SOURCE).map(it => newsRow(it, "")).join("");
    return `<div class="sub-label"><span>${f.name}</span><a href="${f.site}" target="_blank" rel="noopener">More ↗</a></div>${body}`;
  }).join("");
  // Today window: the top story from each source
  $("ov-news").innerHTML = keys.map(k => {
    const f = FEEDS[k], s = news[k];
    if (!s) return "";
    if (s.error) return `<div class="error">${f.name} didn't load.</div>`;
    return s.items[0] ? newsRow(s.items[0], f.name) : "";
  }).join("") || LOADING;
  const loaded = keys.filter(k => news[k] && !news[k].error).length;
  const done = keys.filter(k => news[k]).length;
  $("ov-news-sum").textContent = done === keys.length ? `${loaded}/${keys.length} sources` : "";
  $("news-stamp").textContent = done === keys.length ? `Updated ${hhmm(new Date())}` : "";
}
function loadNews() {
  Object.keys(FEEDS).forEach(k => {
    delete news[k];
    fetchFeed(FEEDS[k].url)
      .then(items => { news[k] = { items }; })
      .catch(() => { news[k] = { error: true }; })
      .finally(renderNews);
  });
  renderNews();
}

  45:["🌫️","Fog"],48:["🌫️","Rime fog"],51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌧️","Heavy drizzle"],
  61:["🌦️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],66:["🌨️","Freezing rain"],67:["🌨️","Freezing rain"],
  71:["🌨️","Light snow"],73:["🌨️","Snow"],75:["❄️","Heavy snow"],77:["❄️","Snow grains"],

};
function wx(code) { return WMO[code] || ["🌡️","—"]; }

function daylightHtml(sunrise, sunset, nextRise) {
  const now = new Date();
  const dur = ms => {
    const m = Math.max(0, Math.round(ms / 60000)), h = Math.floor(m / 60);
    return h > 0 ? `${h}h ${String(m % 60).padStart(2, "0")}m` : `${m}m`;
  };
  let value, note;
  if (now < sunrise)     { value = "Before sunrise"; note = `rises ${hhmm(sunrise)}`; }
  else if (now > sunset) { value = "After dark";     note = nextRise ? `rises ${hhmm(nextRise)}` : `set ${hhmm(sunset)}`; }
  else                   { value = dur(sunset - now); note = "daylight left"; }
  const span = sunset - sunrise;
  const pct = Math.min(100, Math.max(0, ((now - sunrise) / span) * 100));
  return `
    <div class="daylight">
      <div class="dl-head"><span class="dl-value">🌇 ${value}</span><span class="dl-note">${note}</span></div>
      <div class="dl-bar" role="img" aria-label="Daylight elapsed ${Math.round(pct)}%">
        <div class="elapsed" style="width:${pct}%"></div>
        <div class="now" style="left:calc(${pct}% - 1px)"></div>
      </div>
      <div class="dl-ends"><span>↑ ${hhmm(sunrise)}</span><span>${dur(span)} total</span><span>↓ ${hhmm(sunset)}</span></div>
    </div>`;
}

function renderWeather(d) {
  const c = d.current, [ci, cd] = wx(c.weather_code);
  const nowIdx = Math.max(0, d.hourly.time.findIndex(t => new Date(t) > new Date()) - 1);
  const sunrise = new Date(d.daily.sunrise[0]);
  const sunset  = new Date(d.daily.sunset[0]);
  const nextRise = d.daily.sunrise[1] ? new Date(d.daily.sunrise[1]) : null;
  const hi = Math.round(d.daily.temperature_2m_max[0]), lo = Math.round(d.daily.temperature_2m_min[0]);
  const rainMax = d.daily.precipitation_probability_max[0];

  const nowBlock = cls => `
    <div class="wx-now ${cls}">
      <div>
        <div class="wx-temp">${Math.round(c.temperature_2m)}°</div>
        <div class="wx-desc">${cd} · feels ${Math.round(c.apparent_temperature)}°</div>
      </div>
      <div class="wx-icon">${ci}</div>
    </div>`;

  // Today window: now, today in fixed 3-hour slots (past ones dimmed), daylight
  const todayStr = d.daily.time[0];
  const curHour = new Date().getHours();
  let strip = "";
  [6, 9, 12, 15, 18, 21].forEach(h => {
    const i = d.hourly.time.indexOf(`${todayStr}T${String(h).padStart(2, "0")}:00`);
    if (i < 0) return;
    const [e] = wx(d.hourly.weather_code[i]);
    const state = curHour >= h + 3 ? "past" : curHour >= h ? "cur" : "";
    strip += `<div class="${state}"><div class="h">${String(h).padStart(2, "0")}</div><div class="e">${e}</div><div class="t">${Math.round(d.hourly.temperature_2m[i])}°</div><div class="r">${d.hourly.precipitation_probability[i]}%</div></div>`;
  });
  $("ov-wx").innerHTML = nowBlock("compact") + `<div class="strip">${strip}</div>` + daylightHtml(sunrise, sunset, nextRise);
  $("ov-wx-sum").textContent = `${hi}° / ${lo}° · ${rainMax}% rain`;

  // Full tab
  let hourlyRows = "";
  for (let i = nowIdx; i < nowIdx + 8 && i < d.hourly.time.length; i++) {
    const [e] = wx(d.hourly.weather_code[i]);
    hourlyRows += `<tr><td>${hhmm(new Date(d.hourly.time[i]))}</td><td class="wx-em">${e}</td><td>${Math.round(d.hourly.temperature_2m[i])}°</td><td>${d.hourly.precipitation_probability[i]}%</td></tr>`;
  }
  let dailyRows = "";
  d.daily.time.forEach((t, i) => {
    const [e] = wx(d.daily.weather_code[i]);
    const day = i === 0 ? "Today" : new Date(t).toLocaleDateString("en-GB", { weekday: "short" });
    dailyRows += `<tr><td>${day}</td><td class="wx-em">${e}</td><td>${Math.round(d.daily.temperature_2m_max[i])}° <span class="lo">${Math.round(d.daily.temperature_2m_min[i])}°</span></td><td>${d.daily.precipitation_probability_max[i]}%</td></tr>`;
  });
  $("wx").innerHTML = nowBlock("") + `
    <div class="wx-stats">
      <span>💨 <b>${Math.round(c.wind_speed_10m)}</b> km/h</span>
      <span>💧 <b>${c.relative_humidity_2m}%</b></span>
    </div>
    ${daylightHtml(sunrise, sunset, nextRise)}
    <div class="sub-label"><span>Next 8 hours</span></div>
    <div class="table-wrap"><table class="wx"><thead><tr><th>Time</th><th></th><th>Temp</th><th>Rain</th></tr></thead><tbody>${hourlyRows}</tbody></table></div>
    <div class="sub-label"><span>5 days</span></div>
    <div class="table-wrap"><table class="wx"><thead><tr><th>Day</th><th></th><th>High Low</th><th>Rain</th></tr></thead><tbody>${dailyRows}</tbody></table></div>`;
}

// The iCal URL is stored ONLY in this browser (localStorage) — never in the repo.
const CAL_KEY = "dashboard_ics_url";
function getCalUrl() { try { return localStorage.getItem(CAL_KEY) || ""; } catch (e) { return ""; } }

function calSettingsHtml(prefill) {
  return `<div class="cal-form">
      <p>Paste an iCal (.ics) link. It stays on this device.</p>
      <input id="ics-input" class="field" type="url" placeholder="https://…/basic.ics" value="${esc(prefill || "")}" />
      <div class="btn-row">
        <button id="ics-save" class="btn">Save</button>
        ${prefill ? `<button id="ics-clear" class="btn ghost">Remove</button>` : ""}
      </div>
      <details>
        <summary>Where to find the link</summary>
        <div><b>Google:</b> Settings → your calendar → Secret address in iCal format.<br>
        <b>Apple:</b> share the calendar as Public and copy the link (webcal:// links are fine).</div>
      </details>
    </div>`;
}
function wireCalSettings() {
  const save = $("ics-save"), clear = $("ics-clear");
  if (save) save.onclick = () => {
    const v = $("ics-input").value.trim();
    if (!v) return;
    try { localStorage.setItem(CAL_KEY, v); } catch (e) {}
    loadCalendar();
  };
  if (clear) clear.onclick = () => {
    try { localStorage.removeItem(CAL_KEY); } catch (e) {}
    loadCalendar();
  };
}
function showCalSettings(url) { $("cal").innerHTML = calSettingsHtml(url); wireCalSettings(); }

// Calendar routes, fastest first. Jina's reader returns the raw .ics in ~1s;
// allorigins works but can take ~10s, so it gets a longer timeout.
const ICS_ROUTES = [
  { build: u => `https://r.jina.ai/${encodeURIComponent(u)}`, mode: "text", ms: 10000, opts: { headers: { "X-Return-Format": "text" } } },
  { build: u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`, mode: "text", ms: 20000 },
  { build: u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`, mode: "wrapped", ms: 20000 },
  { build: u => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`, mode: "text", ms: 15000 }
];
async function fetchIcs(url) {
  url = url.trim().replace(/^webcal:\/\//i, "https://");   // Apple links start webcal://
  let lastErr;
  for (const p of ICS_ROUTES) {
    try {
      const r = await fetchWithTimeout(p.build(url), p.ms, p.opts);
      if (!r.ok) { lastErr = new Error("HTTP " + r.status); continue; }
      const text = await readProxy(r, p.mode);
      const at = text ? text.indexOf("BEGIN:VCALENDAR") : -1;
      if (at !== -1) return text.slice(at);
      lastErr = new Error("not ics");
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error("all routes failed");
}
function parseICS(text) {
  text = text.replace(/\r\n[ \t]/g, "").replace(/\n[ \t]/g, "");
  const out = []; const blocks = text.split("BEGIN:VEVENT").slice(1);
  const now = new Date(); const todayStart = new Date(now.toDateString());
  const horizon = new Date(now.getTime() + 14 * 864e5);
  for (const b of blocks) {
    const g = re => (b.match(re) || [, ""])[1].trim();
    const summary = g(/SUMMARY[^:]*:(.*)/) || "(no title)";
    const dt = g(/DTSTART[^:]*:(.*)/);
    if (!dt) continue;
    const d = icsDate(dt);
    if (isNaN(d)) continue;
    if (d >= todayStart && d <= horizon) out.push({ summary, date: d, allDay: dt.length <= 8 });
  }
  return out.sort((a, b) => a.date - b.date).slice(0, 25);
}
function icsDate(s) {
  s = s.trim();
  if (s.length <= 8) return new Date(+s.slice(0,4), +s.slice(4,6)-1, +s.slice(6,8));
  const utc = s.endsWith("Z");
  const y=+s.slice(0,4), mo=+s.slice(4,6)-1, da=+s.slice(6,8), h=+s.slice(9,11), mi=+s.slice(11,13);
  return utc ? new Date(Date.UTC(y,mo,da,h,mi)) : new Date(y,mo,da,h,mi);
}
function eventRow(ev, timeLabel) {
  const past = !ev.allDay && ev.date < new Date() && ev.date.toDateString() === new Date().toDateString();
  return `<div class="event ${past ? "past" : ""}"><div class="event-time">${timeLabel}</div><div class="event-title">${esc(ev.summary)}</div></div>`;
}
const evTime = ev => ev.allDay ? "All day" : hhmm(ev.date);

function renderCalendar(events, url) {
  const todayKey = new Date().toDateString();
  const tomorrowKey = new Date(Date.now() + 864e5).toDateString();
  // Full tab
  let html = "", curDay = "";
  events.forEach(ev => {
    const k = ev.date.toDateString();
    if (k !== curDay) {
      const pre = k === todayKey ? "Today · " : k === tomorrowKey ? "Tomorrow · " : "";
      html += `<div class="cal-day">${pre}${ev.date.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}</div>`;
      curDay = k;
    }
    html += eventRow(ev, evTime(ev));
  });
  if (!events.length) html = `<div class="note">Nothing in the next two weeks.</div>`;
  $("cal").innerHTML = html + `<button id="ics-manage" class="text-link">Change calendar link</button>`;
  $("ics-manage").onclick = () => showCalSettings(url);
  $("cal-count").textContent = events.length ? events.length + " events" : "";

  // Today window: today's events, or the next one if today is clear
  const today = events.filter(ev => ev.date.toDateString() === todayKey);
  const left = today.filter(ev => ev.allDay || ev.date >= new Date()).length;
  if (today.length) {
    $("ov-cal").innerHTML = today.map(ev => eventRow(ev, evTime(ev))).join("");
    $("ov-cal-sum").textContent = `${left} of ${today.length} left`;
  } else {
    const next = events[0];
    $("ov-cal").innerHTML = `<div class="note">Nothing on today.</div>` + (next
      ? `<div class="event"><div class="event-time">${next.date.toLocaleDateString("en-GB", { weekday: "short", day: "numeric" })}</div>
           <div class="event-title">${esc(next.summary)} <span class="muted mono">${next.allDay ? "" : hhmm(next.date)}</span></div></div>`
      : "");
    $("ov-cal-sum").textContent = next ? "Next up" : "";
  }
}

async function loadCalendar() {
  const url = getCalUrl();
  $("cal-count").textContent = ""; $("ov-cal-sum").textContent = "";
  if (!url) {
    showCalSettings("");
    $("ov-cal").innerHTML = `<button class="action" data-goto="calendar"><span>Connect a calendar</span><span>→</span></button>`;
    return;
  }
  $("cal").innerHTML = LOADING; $("ov-cal").innerHTML = LOADING;
  try {
    renderCalendar(parseICS(await fetchIcs(url)), url);
  } catch (e) {
    $("cal").innerHTML = `<div class="error">Calendar didn't load. Check the link is an iCal (.ics) address.</div>` + calSettingsHtml(url);
    wireCalSettings();
    $("ov-cal").innerHTML = `<div class="error">Calendar didn't load. Tap ↻ to retry.</div>`;
  }
}

/* ============ HABITS ============ */
// Same storage key as the standalone tracker, so existing data carries over.
const HB_KEY = "habits_v1";
function hbLoad() { try { return JSON.parse(localStorage.getItem(HB_KEY)) || []; } catch (e) { return []; } }
function hbSave(h) { try { localStorage.setItem(HB_KEY, JSON.stringify(h)); } catch (e) {} }
let hbHabits = hbLoad();

function hbDayKey(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
const HB_TODAY = hbDayKey(new Date());
function hbDaysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return hbDayKey(d); }
function hbStreak(done) {
  const set = new Set(done);
  let streak = 0;
  const start = set.has(HB_TODAY) ? 0 : 1;
  if (start === 1 && !set.has(hbDaysAgo(1))) return 0;
  for (let i = start; i < 400; i++) { if (set.has(hbDaysAgo(i))) streak++; else break; }
  return streak;
}

// One row component, used on both the Habits tab (with grid + delete) and Today (compact)
function habitRow(h, idx, full) {
  const isDone = h.done.includes(HB_TODAY);
  const streak = hbStreak(h.done);
  let grid = "";
  if (full) {
    const doneSet = new Set(h.done);
    let cells = "";
    for (let i = 27; i >= 0; i--) {
      cells += `<div class="cell ${doneSet.has(hbDaysAgo(i)) ? "on" : ""} ${i === 0 ? "today" : ""}"></div>`;
    }
    grid = `<div class="grid" title="Last 28 days">${cells}</div>`;
  }
  return `
    <div class="habit ${isDone ? "done" : ""}">
      <div class="habit-top" role="button" tabindex="0" aria-pressed="${isDone}" data-hb-toggle="${idx}">
        <span class="check" aria-hidden="true">✓</span>
        <span class="habit-name">${esc(h.name)}</span>
        <span class="habit-streak ${streak > 0 ? "on" : ""}">${streak > 0 ? `🔥 ${streak}d` : "—"}</span>
        ${full ? `<button class="del" data-hb-del="${idx}" aria-label="Delete ${esc(h.name)}">✕</button>` : ""}
      </div>
      ${grid}
    </div>`;
}

function hbRender() {
  const n = hbHabits.length;
  const doneToday = hbHabits.filter(h => h.done.includes(HB_TODAY)).length;
  const sum = n ? `${doneToday}/${n} done` : "";
  $("hb-summary").textContent = sum;
  $("ov-hb-sum").textContent = sum;
  if (!n) {
    $("hb-list").innerHTML = `<div class="note">No habits yet.</div>`;
    $("ov-habits").innerHTML = `<button class="action" data-goto="habits"><span>Add your first habit</span><span>→</span></button>`;
    return;
  }
  $("hb-list").innerHTML = hbHabits.map((h, i) => habitRow(h, i, true)).join("");
  // Today: still-to-do first, done ones sink to the bottom
  const order = hbHabits.map((h, i) => i)
    .sort((a, b) => hbHabits[a].done.includes(HB_TODAY) - hbHabits[b].done.includes(HB_TODAY) || a - b);
  $("ov-habits").innerHTML = order.map(i => habitRow(hbHabits[i], i, false)).join("");
}

function hbToggle(idx) {
  const h = hbHabits[idx]; if (!h) return;
  const i = h.done.indexOf(HB_TODAY);
  if (i === -1) h.done.push(HB_TODAY); else h.done.splice(i, 1);
  hbSave(hbHabits); hbRender();
}
function onHabitClick(e) {
  const del = e.target.closest("[data-hb-del]");
  if (del) {
    e.stopPropagation();
    const idx = +del.dataset.hbDel, h = hbHabits[idx];
    if (confirm(`Delete "${h.name}" and its history?`)) { hbHabits.splice(idx, 1); hbSave(hbHabits); hbRender(); }
    return;
  }
  const t = e.target.closest("[data-hb-toggle]");
  if (t) hbToggle(+t.dataset.hbToggle);
}
function onHabitKey(e) {
  const t = e.target.closest("[data-hb-toggle]");
  if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); hbToggle(+t.dataset.hbToggle); }
}
["hb-list", "ov-habits"].forEach(id => {
  $(id).addEventListener("click", onHabitClick);
  $(id).addEventListener("keydown", onHabitKey);
});
function hbAdd() {
  const input = $("hb-new");
  const name = input.value.trim();
  if (!name) return;
  hbHabits.push({ name, done: [] });
  hbSave(hbHabits); input.value = ""; hbRender();
}
$("hb-add").addEventListener("click", hbAdd);
$("hb-new").addEventListener("keydown", e => { if (e.key === "Enter") hbAdd(); });

/* ============ LOAD ALL ============ */
function loadAll() {
  loadNews();
  loadWeather();
  loadCalendar();
}
$("refresh").addEventListener("click", loadAll);
hbRender();
loadAll();
loadQuote();
</script>
