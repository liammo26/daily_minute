<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>The Daily Minute</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    /* Brand colours — shared across themes */
    --bbc: #bb1919;
    --sport: #f5c518;
    --ajz: #fa9000;
    --weather: #2f8fd6;
    --cal: #2fa85f;
    --habit: #2fa85f;
    --habit-flame: #ff9f1c;

    /* Dark theme (default) */
    --bg: #0f1115;
    --card: #191c22;
    --card-hover: #21252d;
    --text: #e8eaed;
    --muted: #9aa0aa;
    --line: #2a2e37;
    --accent: #4f9dde;
    --accent-dim: #2d5138;
    --header-bg: rgba(15,17,21,.85);
    --wx-grad: linear-gradient(135deg, #1a2733, #191c22);
    /* Per-section tint of the page background — subtle in dark mode */
    --section-tint: transparent;
    --tab-active-text: #fff;
  }

  [data-theme="light"] {
    --bg: #f4f5f7;
    --card: #ffffff;
    --card-hover: #eef0f3;
    --text: #14161a;
    --muted: #5c6470;
    --line: #dfe3e8;
    --accent: #2f8fd6;
    --accent-dim: #bfe0cb;
    --header-bg: rgba(255,255,255,.9);
    --wx-grad: linear-gradient(135deg, #e3f0fb, #ffffff);
    --section-tint: transparent;
    --tab-active-text: #fff;
    /* Punchier brand colours for light mode */
    --sport: #e0aa00;
    --habit-flame: #f57c00;
  }
  [data-theme="light"] .tab.active { color: #fff; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-font-smoothing: antialiased;
  }
  .top-bar {
    position: sticky; top: 0; z-index: 20;
  }
  header {
    padding: 18px 16px 12px;
    background: var(--header-bg);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .head-row { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.5px; }
  .date { color: var(--muted); font-size: .85rem; }
  .refresh {
    background: var(--card); border: 1px solid var(--line); color: var(--muted);
    border-radius: 20px; padding: 5px 12px; font-size: .78rem; cursor: pointer;
    margin-top: 8px; display: inline-flex; align-items: center; gap: 5px;
  }
  .refresh:active { background: var(--card-hover); }
  .quote {
    margin-top: 10px; font-size: .82rem; color: var(--muted);
    font-style: italic; line-height: 1.45; max-width: 90%;
  }
  .quote b { color: var(--text); font-style: normal; font-weight: 600; }
  .quote a { color: var(--muted); text-decoration: none; font-style: normal; opacity: .6; }

  /* Tab bar */
  nav {
    display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px;
    background: var(--header-bg); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line); scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  .tab {
    white-space: nowrap; padding: 7px 14px; border-radius: 18px;
    background: var(--card); border: 1px solid var(--line); color: var(--muted);
    font-size: .85rem; font-weight: 500; cursor: pointer; flex-shrink: 0;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: var(--tab-active-text); }

  /* Per-tab brand colours when active */
  .tab[data-tab="bbc"].active     { background: var(--bbc);     border-color: var(--bbc);     color: #fff; }
  .tab[data-tab="sport"].active   { background: var(--sport);   border-color: var(--sport);   color: #1a1400; }
  .tab[data-tab="ajz"].active     { background: var(--ajz);     border-color: var(--ajz);     color: #fff; }
  .tab[data-tab="weather"].active { background: var(--weather); border-color: var(--weather); color: #fff; }
  .tab[data-tab="calendar"].active{ background: var(--cal);     border-color: var(--cal);     color: #fff; }
  .tab[data-tab="habits"].active  { background: var(--habit);   border-color: var(--habit);   color: #fff; }

  /* Per-section page tint — each section paints --brand, everything themable reads it */
  #bbc      { --brand: var(--bbc); }
  #sport    { --brand: var(--sport); }
  #ajz      { --brand: var(--ajz); }
  #weather  { --brand: var(--weather); }
  #calendar { --brand: var(--cal); }
  #habits   { --brand: var(--habit); }
  section.active .sec-title { color: var(--brand); }
  /* Light mode: tint the section background and accents with the brand colour */
  [data-theme="light"] section.active .card,
  [data-theme="light"] section.active .habit,
  [data-theme="light"] section.active .event,
  [data-theme="light"] section.active .wx-now,
  [data-theme="light"] section.active .cal-note {
    border-color: color-mix(in srgb, var(--brand) 35%, var(--line));
  }
  [data-theme="light"] section.active .card.lead { border-left-color: var(--brand); }
  /* subtle brand wash behind the active section in light mode */
  [data-theme="light"] section.active {
    background: color-mix(in srgb, var(--brand) 7%, transparent);
    border-radius: 16px; padding: 12px; margin: -12px -4px 0;
  }
  .theme-toggle {
    background: var(--card); border: 1px solid var(--line); color: var(--muted);
    border-radius: 20px; padding: 5px 12px; font-size: .78rem; cursor: pointer;
    margin-top: 8px; margin-left: 8px; display: inline-flex; align-items: center; gap: 5px;
  }
  .theme-toggle:active { background: var(--card-hover); }

  main { padding: 14px 16px 40px; max-width: 620px; margin: 0 auto; }
  section { display: none; }
  section.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .sec-title {
    display: flex; align-items: center; gap: 8px;
    font-size: .95rem; font-weight: 600; margin: 4px 0 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .5px; font-size: .72rem;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; }

  /* News cards */
  .card {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px; margin-bottom: 10px;
    transition: background .15s;
  }
  .card:active { background: var(--card-hover); }
  .card.lead { border-left: 3px solid var(--accent); }
  .card-title { font-size: .98rem; font-weight: 600; margin-bottom: 5px; }
  .card.lead .card-title { font-size: 1.08rem; }
  .card-desc { font-size: .85rem; color: var(--muted); margin-bottom: 7px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-meta { font-size: .72rem; color: var(--muted); display: flex; gap: 8px; align-items: center; }

  /* Weather */
  .wx-now {
    background: var(--wx-grad);
    border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 12px;
  }
  .wx-top { display: flex; justify-content: space-between; align-items: center; }
  .wx-temp { font-size: 3rem; font-weight: 700; letter-spacing: -2px; }
  .wx-icon { font-size: 3rem; }
  .wx-desc { color: var(--muted); font-size: .9rem; margin-top: 2px; }
  .wx-stats { display: flex; gap: 18px; margin-top: 14px; font-size: .82rem; color: var(--muted); flex-wrap: wrap; }
  .wx-stats b { color: var(--text); font-weight: 600; }
  table.wx { width: 100%; border-collapse: collapse; font-size: .85rem; }
  table.wx th { text-align: left; color: var(--muted); font-weight: 500; padding: 8px 6px; font-size: .72rem; text-transform: uppercase; border-bottom: 1px solid var(--line); }
  table.wx td { padding: 9px 6px; border-bottom: 1px solid var(--line); }
  table.wx tr:last-child td { border-bottom: none; }
  .wx-em { font-size: 1.1rem; }

  /* Calendar */
  .cal-day { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 16px 0 8px; }
  .event {
    display: flex; gap: 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; margin-bottom: 8px;
  }
  .event-time { font-size: .8rem; color: var(--accent); font-weight: 600; min-width: 52px; }
  .event-title { font-size: .92rem; }
  .cal-note {
    background: var(--card); border: 1px dashed var(--line); border-radius: 12px;
    padding: 16px; font-size: .85rem; color: var(--muted); text-align: center;
  }
  .cal-note a { color: var(--accent); }

  /* Habits */
  .habit { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .habit-top { display: flex; align-items: center; gap: 12px; }
  .check {
    width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
    border: 2px solid var(--line); background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; cursor: pointer; transition: all .15s; color: transparent;
  }
  .check.done { background: var(--habit); border-color: var(--habit); color: #0f1115; }
  .check:active { transform: scale(.92); }
  .habit-info { flex: 1; min-width: 0; }
  .habit-name { font-size: 1rem; font-weight: 600; }
  .habit-streak { font-size: .8rem; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 4px; }
  .flame { color: var(--habit-flame); }
  .del { background: none; border: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; padding: 6px; opacity: .5; }
  .del:active { opacity: 1; }
  .grid { display: flex; gap: 4px; margin-top: 12px; flex-wrap: wrap; }
  .cell { width: 15px; height: 15px; border-radius: 4px; background: var(--card-hover); border: 1px solid var(--line); }
  .cell.on { background: var(--habit); border-color: var(--habit); }
  .cell.today { box-shadow: 0 0 0 2px var(--accent-dim, #2d5138); }
  .grid-label { font-size: .68rem; color: var(--muted); margin-top: 10px; text-transform: uppercase; letter-spacing: .5px; }
  .add-row { display: flex; gap: 8px; margin-top: 8px; }
  .add-row input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: .9rem; }
  .add-row input::placeholder { color: var(--muted); }
  .btn { padding: 12px 16px; border-radius: 10px; border: 1px solid var(--habit); background: var(--habit); color: #0f1115; font-weight: 600; font-size: .9rem; cursor: pointer; }
  .btn:active { opacity: .85; }
  .summary { text-align: center; color: var(--muted); font-size: .82rem; margin: 4px 0 18px; }
  .summary b { color: var(--text); }
  .empty { text-align: center; color: var(--muted); padding: 30px 16px; font-size: .9rem; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; margin-bottom: 16px; }

  .loading, .error {
    text-align: center; color: var(--muted); padding: 30px 10px; font-size: .88rem;
  }
  .spinner {
    width: 22px; height: 22px; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error a { color: var(--accent); }
  footer { text-align: center; color: var(--muted); font-size: .72rem; padding: 20px 16px 0; }
</style>
</head>
<body>
<div class="top-bar">
<header>
  <div class="head-row">
    <h1>Daily</h1>
    <span class="date" id="date"></span>
  </div>
  <div class="quote" id="quote"></div>
  <button class="refresh" id="refresh">↻ Refresh</button>
  <button class="theme-toggle" id="theme-toggle">☀️ Light</button>
</header>

<nav id="tabs">
  <button class="tab active" data-tab="habits">Habits</button>
  <button class="tab" data-tab="calendar">Calendar</button>
  <button class="tab" data-tab="weather">Weather</button>
  <button class="tab" data-tab="bbc">BBC News</button>
  <button class="tab" data-tab="sport">BBC Sport</button>
  <button class="tab" data-tab="ajz">Al Jazeera</button>
</nav>
</div>

<main>
  <section id="bbc">
    <div class="sec-title"><span class="dot" style="background:var(--bbc)"></span>BBC News · Top Stories</div>
    <div id="bbc-feed"><div class="loading"><div class="spinner"></div>Loading headlines…</div></div>
  </section>

  <section id="sport">
    <div class="sec-title"><span class="dot" style="background:var(--sport)"></span>BBC Sport</div>
    <div id="sport-feed"><div class="loading"><div class="spinner"></div>Loading headlines…</div></div>
  </section>

  <section id="ajz">
    <div class="sec-title"><span class="dot" style="background:var(--ajz)"></span>Al Jazeera</div>
    <div id="ajz-feed"><div class="loading"><div class="spinner"></div>Loading headlines…</div></div>
  </section>

  <section id="weather">
    <div class="sec-title"><span class="dot" style="background:var(--weather)"></span>Weather · Edinburgh</div>
    <div id="wx"><div class="loading"><div class="spinner"></div>Loading forecast…</div></div>
  </section>

  <section id="calendar">
    <div class="sec-title"><span class="dot" style="background:var(--cal)"></span>Calendar</div>
    <div id="cal"></div>
  </section>

  <section class="active" id="habits">
    <div class="sec-title"><span class="dot" style="background:var(--habit)"></span>Habits</div>
    <div class="summary" id="hb-summary"></div>
    <div id="hb-list"></div>
    <div class="add-row">
      <input id="hb-new" type="text" placeholder="New habit — e.g. Read 20 min" maxlength="40" />
      <button class="btn" id="hb-add">Add</button>
    </div>
  </section>
</main>

<footer>Pull-to-refresh or tap ↻ · Updates on load</footer>

<script>
/* ============ CONFIG ============ */
const FEEDS = {
  bbc:   { url: "https://feeds.bbci.co.uk/news/rss.xml",        lead: true },
  sport: { url: "https://feeds.bbci.co.uk/sport/rss.xml",       lead: true },
  ajz:   { url: "https://www.aljazeera.com/xml/rss/all.xml",    lead: true }
};
// Edinburgh coordinates
const LAT = 55.9533, LON = -3.1883;
// Fallback chain of CORS proxies. Each entry says how to build the URL and how to read the body.
// "text" = proxy returns the raw XML; "wrapped" = proxy returns {contents: "<xml>"}.
const CORS_PROXIES = [
  { build: u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,            mode: "text" },
  { build: u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,   mode: "text" },
  { build: u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,   mode: "wrapped" },
  { build: u => `https://thingproxy.freeboard.io/fetch/${u}`,                    mode: "text" },
  { build: u => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`, mode: "text" }
];

/* ============ THEME ============ */
const THEME_KEY = "dashboard_theme";
function applyTheme(mode) {
  const btn = document.getElementById("theme-toggle");
  if (mode === "light") {
    document.documentElement.setAttribute("data-theme", "light");
    document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f4f5f7");
    btn.textContent = "🌙 Dark";
  } else {
    document.documentElement.removeAttribute("data-theme");
    document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0f1115");
    btn.textContent = "☀️ Light";
  }
}
let currentTheme;
try { currentTheme = localStorage.getItem(THEME_KEY) || "dark"; } catch (e) { currentTheme = "dark"; }
applyTheme(currentTheme);
document.getElementById("theme-toggle").addEventListener("click", () => {
  currentTheme = currentTheme === "light" ? "dark" : "light";
  try { localStorage.setItem(THEME_KEY, currentTheme); } catch (e) {}
  applyTheme(currentTheme);
});

/* ============ DATE ============ */
document.getElementById("date").textContent =
  new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });

/* ============ DAILY QUOTE ============ */
// Offline fallback set — guarantees the header is never empty if the network/API fails.
const FALLBACK_QUOTES = [
  ["The secret of getting ahead is getting started.", "Mark Twain"],
  ["Well done is better than well said.", "Benjamin Franklin"],
  ["What we know is a drop, what we don't know is an ocean.", "Isaac Newton"],
  ["It always seems impossible until it's done.", "Nelson Mandela"],
  ["Simplicity is the ultimate sophistication.", "Leonardo da Vinci"],
  ["Whether you think you can or you can't, you're right.", "Henry Ford"],
  ["The best way out is always through.", "Robert Frost"],
  ["Discipline equals freedom.", "Jocko Willink"],
  ["A goal without a plan is just a wish.", "Antoine de Saint-Exupéry"],
  ["Do the hard jobs first. The easy jobs will take care of themselves.", "Dale Carnegie"],
  ["Success is not final, failure is not fatal.", "Winston Churchill"],
  ["Action is the foundational key to all success.", "Pablo Picasso"],
  ["Start where you are. Use what you have. Do what you can.", "Arthur Ashe"],
  ["Quality is not an act, it is a habit.", "Aristotle"]
];
function dayIndex() {
  // Days since epoch — stable per calendar day, rotates the fallback set.
  return Math.floor(Date.now() / 864e5);
}
function fallbackQuote() {
  return FALLBACK_QUOTES[dayIndex() % FALLBACK_QUOTES.length];
}
function renderQuote(text, author) {
  document.getElementById("quote").innerHTML =
    `“${text}” <b>— ${author}</b> <a href="https://zenquotes.io" target="_blank" rel="noopener">·</a>`;
}
async function loadQuote() {
  const el = document.getElementById("quote");
  const todayKey = new Date().toDateString();
  // Use cached quote if already fetched today
  try {
    const cached = JSON.parse(localStorage.getItem("daily_quote") || "null");
    if (cached && cached.day === todayKey) { renderQuote(cached.q, cached.a); return; }
  } catch (e) {}
  // Show fallback immediately so header is never blank, then try to upgrade to a live quote
  const [fq, fa] = fallbackQuote();
  renderQuote(fq, fa);
  const api = "https://zenquotes.io/api/today";
  const tryParse = raw => {
    const arr = JSON.parse(raw);
    if (Array.isArray(arr) && arr[0] && arr[0].q) return [arr[0].q.trim(), arr[0].a || "Unknown"];
    return null;
  };
  // Attempt: direct, then through the proxy chain
  const attempts = [
    () => fetchWithTimeout(api, 6000).then(r => r.text()),
    ...CORS_PROXIES.map(p => () => fetchWithTimeout(p.build(api), 6000)
      .then(r => p.mode === "wrapped" ? r.json().then(j => j.contents) : r.text()))
  ];
  for (const attempt of attempts) {
    try {
      const raw = await attempt();
      const parsed = tryParse(raw);
      if (parsed) {
        renderQuote(parsed[0], parsed[1]);
        try { localStorage.setItem("daily_quote", JSON.stringify({ day: todayKey, q: parsed[0], a: parsed[1] })); } catch (e) {}
        return;
      }
    } catch (e) {}
  }
  // If all fail, the fallback is already showing — nothing more to do.
}

/* ============ TABS ============ */
const TAB_ORDER = ["habits", "calendar", "weather", "bbc", "sport", "ajz"];
function activateTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  const btn = document.querySelector(`.tab[data-tab="${name}"]`);
  const sec = document.getElementById(name);
  if (!btn || !sec) return;
  btn.classList.add("active");
  sec.classList.add("active");
  btn.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function currentTabIndex() {
  const active = document.querySelector(".tab.active");
  return active ? TAB_ORDER.indexOf(active.dataset.tab) : 0;
}
function moveTab(dir) {
  const n = TAB_ORDER.length;
  const next = (currentTabIndex() + dir + n) % n;  // wraps around
  activateTab(TAB_ORDER[next]);
}

document.getElementById("tabs").addEventListener("click", e => {
  const btn = e.target.closest(".tab"); if (!btn) return;
  activateTab(btn.dataset.tab);
});

/* ============ SWIPE TO CHANGE TAB ============ */
(function () {
  let startX = 0, startY = 0, tracking = false;
  const THRESHOLD = 55;   // min horizontal distance (px) to count as a swipe
  const main = document.querySelector("main");

  main.addEventListener("touchstart", e => {
    // Ignore multi-touch (pinch/zoom) and swipes starting on horizontally-scrollable bits
    if (e.touches.length !== 1) { tracking = false; return; }
    if (e.target.closest("nav, table, input")) { tracking = false; return; }
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, { passive: true });

  main.addEventListener("touchend", e => {
    if (!tracking) return;
    tracking = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    // Only act on a deliberate, mostly-horizontal swipe (lets vertical scrolling pass through)
    if (Math.abs(dx) < THRESHOLD) return;
    if (Math.abs(dx) < Math.abs(dy) * 1.5) return;
    moveTab(dx < 0 ? 1 : -1);   // swipe left → next tab, right → previous
  }, { passive: true });
})();

/* ============ HELPERS ============ */
function timeAgo(dateStr) {
  const d = new Date(dateStr); if (isNaN(d)) return "";
  const mins = Math.floor((Date.now() - d) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  return Math.floor(hrs / 24) + "d ago";
}
function stripHtml(s) { const t = document.createElement("div"); t.innerHTML = s || ""; return t.textContent.trim(); }

function fetchWithTimeout(u, ms = 8000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  return fetch(u, { signal: ctrl.signal }).finally(() => clearTimeout(t));
}

function parseFeedXml(xmlText) {
  const xml = new DOMParser().parseFromString(xmlText, "text/xml");
  if (xml.querySelector("parsererror")) throw new Error("bad xml");
  // RSS <item> or Atom <entry>
  let nodes = [...xml.querySelectorAll("item")];
  if (!nodes.length) nodes = [...xml.querySelectorAll("entry")];
  if (!nodes.length) throw new Error("no items");
  return nodes.slice(0, 15).map(it => {
    const get = tag => it.querySelector(tag)?.textContent?.trim() || "";
    // Atom links live in an attribute
    let link = get("link");
    if (!link) link = it.querySelector("link")?.getAttribute("href") || "";
    return {
      title: get("title"),
      link,
      desc: stripHtml(get("description") || get("summary")),
      date: get("pubDate") || get("published") || get("updated")
    };
  });
}

async function fetchFeed(url) {
  let lastErr;
  for (const p of CORS_PROXIES) {
    try {
      const r = await fetchWithTimeout(p.build(url));
      if (!r.ok) { lastErr = new Error("HTTP " + r.status); continue; }
      let xmlText;
      if (p.mode === "wrapped") {
        const j = await r.json();
        xmlText = j.contents;
      } else {
        xmlText = await r.text();
      }
      if (!xmlText || xmlText.length < 100) { lastErr = new Error("empty"); continue; }
      const items = parseFeedXml(xmlText);
      if (items.length) return items;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error("all proxies failed");
}

function renderNews(id, items, lead, label) {
  const el = document.getElementById(id);
  if (!items.length) { el.innerHTML = `<div class="error">No items right now.</div>`; return; }
  el.innerHTML = items.map((it, i) => `
    <a class="card ${lead && i === 0 ? "lead" : ""}" href="${it.link}" target="_blank" rel="noopener">
      <div class="card-title">${it.title}</div>
      ${it.desc ? `<div class="card-desc">${it.desc}</div>` : ""}
      <div class="card-meta"><span>${label}</span>${it.date ? `<span>· ${timeAgo(it.date)}</span>` : ""}</div>
    </a>`).join("");
}

async function loadNews(key, id, label) {
  const el = document.getElementById(id);
  try {
    const items = await fetchFeed(FEEDS[key].url);
    renderNews(id, items, FEEDS[key].lead, label);
  } catch (e) {
    el.innerHTML = `<div class="error">Couldn't load feed.<br><a href="${FEEDS[key].url}" target="_blank">Open source feed →</a></div>`;
  }
}

/* ============ WEATHER (Open-Meteo, no key) ============ */
const WMO = {
  0:["☀️","Clear"],1:["🌤️","Mainly clear"],2:["⛅","Partly cloudy"],3:["☁️","Overcast"],
  45:["🌫️","Fog"],48:["🌫️","Rime fog"],51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌧️","Heavy drizzle"],
  61:["🌦️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],66:["🌨️","Freezing rain"],67:["🌨️","Freezing rain"],
  71:["🌨️","Light snow"],73:["🌨️","Snow"],75:["❄️","Heavy snow"],77:["❄️","Snow grains"],
  80:["🌦️","Showers"],81:["🌧️","Showers"],82:["⛈️","Heavy showers"],
  85:["🌨️","Snow showers"],86:["❄️","Snow showers"],95:["⛈️","Thunderstorm"],96:["⛈️","Storm w/ hail"],99:["⛈️","Storm w/ hail"]
};
function wx(code){ return WMO[code] || ["🌡️","—"]; }

async function loadWeather() {
  const el = document.getElementById("wx");
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
    + `&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m`
    + `&hourly=temperature_2m,weather_code,precipitation_probability`
    + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset`
    + `&timezone=Europe/London&forecast_days=5`;
  try {
    const r = await fetch(url); const d = await r.json();
    const c = d.current, [ci, cd] = wx(c.weather_code);
    // next 8 hourly from current hour
    const nowIdx = d.hourly.time.findIndex(t => new Date(t) > new Date()) - 1;
    const hStart = Math.max(0, nowIdx);
    let hourlyRows = "";
    for (let i = hStart; i < hStart + 8 && i < d.hourly.time.length; i++) {
      const [hi] = wx(d.hourly.weather_code[i]);
      const hr = new Date(d.hourly.time[i]).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
      hourlyRows += `<tr><td>${hr}</td><td class="wx-em">${hi}</td><td>${Math.round(d.hourly.temperature_2m[i])}°</td><td>${d.hourly.precipitation_probability[i]}%</td></tr>`;
    }
    let dailyRows = "";
    d.daily.time.forEach((t, i) => {
      const [di] = wx(d.daily.weather_code[i]);
      const day = i === 0 ? "Today" : new Date(t).toLocaleDateString("en-GB",{weekday:"short"});
      dailyRows += `<tr><td>${day}</td><td class="wx-em">${di}</td><td><b>${Math.round(d.daily.temperature_2m_max[i])}°</b> / ${Math.round(d.daily.temperature_2m_min[i])}°</td><td>${d.daily.precipitation_probability_max[i]}%</td></tr>`;
    });

    // --- Daylight (remaining) ---
    const sunrise = new Date(d.daily.sunrise[0]);
    const sunset  = new Date(d.daily.sunset[0]);
    const nowT = new Date();
    const fmt = dt => dt.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
    const dur = ms => {
      const m = Math.max(0, Math.round(ms/60000));
      const h = Math.floor(m/60);
      return h > 0 ? `${h}h ${m%60}m` : `${m%60}m`;
    };
    let daylightHtml;
    if (nowT < sunrise) {
      daylightHtml = `<div class="wx-temp" style="font-size:1.6rem">Not up yet</div>
        <div class="wx-desc">Sunrise ${fmt(sunrise)} · sets ${fmt(sunset)}</div>`;
    } else if (nowT > sunset) {
      // remaining daylight for tomorrow, if we have it
      const nextRise = d.daily.sunrise[1] ? new Date(d.daily.sunrise[1]) : null;
      daylightHtml = `<div class="wx-temp" style="font-size:1.6rem">After dark</div>
        <div class="wx-desc">Set ${fmt(sunset)}${nextRise ? ` · rises ${fmt(nextRise)}` : ""}</div>`;
    } else {
      const remaining = dur(sunset - nowT);
      daylightHtml = `<div class="wx-temp" style="font-size:1.9rem">${remaining}</div>
        <div class="wx-desc">of daylight left · sunset ${fmt(sunset)}</div>`;
    }
    el.innerHTML = `
      <div class="wx-now">
        <div class="wx-top">
          <div>
            <div class="wx-temp">${Math.round(c.temperature_2m)}°</div>
            <div class="wx-desc">${cd} · feels ${Math.round(c.apparent_temperature)}°</div>
          </div>
          <div class="wx-icon">${ci}</div>
        </div>
        <div class="wx-stats">
          <span>💨 <b>${Math.round(c.wind_speed_10m)}</b> km/h</span>
          <span>💧 <b>${c.relative_humidity_2m}%</b></span>
        </div>
      </div>
      <div class="wx-now" style="display:flex;align-items:center;gap:14px">
        <div class="wx-icon" style="font-size:2.2rem">🌇</div>
        <div>${daylightHtml}</div>
      </div>
      <div class="sec-title" style="margin-top:8px">Next hours</div>
      <div class="card" style="padding:6px 12px">
        <table class="wx"><thead><tr><th>Time</th><th></th><th>Temp</th><th>Rain</th></tr></thead><tbody>${hourlyRows}</tbody></table>
      </div>
      <div class="sec-title" style="margin-top:16px">5-day</div>
      <div class="card" style="padding:6px 12px">
        <table class="wx"><thead><tr><th>Day</th><th></th><th>High / Low</th><th>Rain</th></tr></thead><tbody>${dailyRows}</tbody></table>
      </div>`;
  } catch (e) {
    el.innerHTML = `<div class="error">Couldn't load weather.</div>`;
  }
}

/* ============ CALENDAR ============ */
// The iCal URL is stored ONLY in this browser (localStorage) — never in the repo.
const CAL_KEY = "dashboard_ics_url";
function getCalUrl() { try { return localStorage.getItem(CAL_KEY) || ""; } catch (e) { return ""; } }

function calSettingsHtml(prefill) {
  return `<div class="cal-note" style="text-align:left">
      <b>Connect your calendar</b><br><br>
      In Google Calendar (on desktop): Settings → click your calendar in the left list →
      scroll to <b>Secret address in iCal format</b> → copy that link.<br>
      Apple/Outlook calendars also give a public/shared <b>.ics</b> link.<br><br>
      Paste it here — it's saved on this device only:
      <input id="ics-input" type="url" placeholder="https://calendar.google.com/…/basic.ics"
        value="${prefill || ""}"
        style="width:100%;margin-top:10px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:.85rem" />
      <div style="display:flex;gap:8px;margin-top:10px">
        <button id="ics-save" class="refresh" style="margin:0;flex:1;justify-content:center;background:var(--accent);color:#fff;border-color:var(--accent)">Save & load</button>
        ${prefill ? `<button id="ics-clear" class="refresh" style="margin:0">Remove</button>` : ""}
      </div>
    </div>`;
}

function wireCalSettings() {
  const save = document.getElementById("ics-save");
  const clear = document.getElementById("ics-clear");
  if (save) save.onclick = () => {
    const v = document.getElementById("ics-input").value.trim();
    if (!v) return;
    try { localStorage.setItem(CAL_KEY, v); } catch (e) {}
    loadCalendar();
  };
  if (clear) clear.onclick = () => {
    try { localStorage.removeItem(CAL_KEY); } catch (e) {}
    loadCalendar();
  };
}

async function loadCalendar() {
  const el = document.getElementById("cal");
  const url = getCalUrl();
  if (!url) { el.innerHTML = calSettingsHtml(""); wireCalSettings(); return; }
  el.innerHTML = `<div class="loading"><div class="spinner"></div>Loading calendar…</div>`;
  try {
    const text = await fetchIcs(url);
    const events = parseICS(text);
    renderCalendar(events, url);
  } catch (e) {
    el.innerHTML = `<div class="cal-note">Couldn't load that calendar. Make sure the link is the
      <b>public/secret iCal (.ics)</b> address and is reachable.</div>` + calSettingsHtml(url);
    wireCalSettings();
  }
}

// Reuse the same proxy chain the news feeds use.
async function fetchIcs(url) {
  let lastErr;
  for (const p of CORS_PROXIES) {
    try {
      const r = await fetchWithTimeout(p.build(url));
      if (!r.ok) { lastErr = new Error("HTTP " + r.status); continue; }
      let text = p.mode === "wrapped" ? (await r.json()).contents : await r.text();
      if (text && text.indexOf("BEGIN:VCALENDAR") !== -1) return text;
      lastErr = new Error("not ics");
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error("all proxies failed");
}

function parseICS(text) {
  // Unfold folded lines (iCal wraps long lines with CRLF + space/tab)
  text = text.replace(/\r\n[ \t]/g, "").replace(/\n[ \t]/g, "");
  const out = []; const blocks = text.split("BEGIN:VEVENT").slice(1);
  const now = new Date(); const todayStart = new Date(now.toDateString());
  const horizon = new Date(now.getTime() + 14 * 864e5);
  for (const b of blocks) {
    const g = re => (b.match(re) || [, ""])[1].trim();
    const summary = g(/SUMMARY[^:]*:(.*)/) || "(no title)";
    const dt = g(/DTSTART[^:]*:(.*)/);
    if (!dt) continue;
    const d = icsDate(dt);
    if (isNaN(d)) continue;
    if (d >= todayStart && d <= horizon) out.push({ summary, date: d, allDay: dt.length <= 8 });
  }
  return out.sort((a, b) => a.date - b.date).slice(0, 25);
}
function icsDate(s) {
  s = s.trim();
  if (s.length <= 8) return new Date(+s.slice(0,4), +s.slice(4,6)-1, +s.slice(6,8));
  const utc = s.endsWith("Z");
  const y=+s.slice(0,4), mo=+s.slice(4,6)-1, da=+s.slice(6,8), h=+s.slice(9,11), mi=+s.slice(11,13);
  return utc ? new Date(Date.UTC(y,mo,da,h,mi)) : new Date(y,mo,da,h,mi);
}
function renderCalendar(events, url) {
  const el = document.getElementById("cal");
  const manage = `<div style="text-align:center;margin-top:16px">
    <button id="ics-manage" class="refresh">⚙ Change calendar link</button></div>`;
  if (!events.length) {
    el.innerHTML = `<div class="cal-note">No events in the next 2 weeks.</div>` + manage;
    document.getElementById("ics-manage").onclick = () => { el.innerHTML = calSettingsHtml(url); wireCalSettings(); };
    return;
  }
  let html = ""; let curDay = "";
  events.forEach(ev => {
    const dayKey = ev.date.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
    if (dayKey !== curDay) { html += `<div class="cal-day">${dayKey}</div>`; curDay = dayKey; }
    const time = ev.allDay ? "All day" : ev.date.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
    html += `<div class="event"><div class="event-time">${time}</div><div class="event-title">${ev.summary}</div></div>`;
  });
  el.innerHTML = html + manage;
  document.getElementById("ics-manage").onclick = () => { el.innerHTML = calSettingsHtml(url); wireCalSettings(); };
}

/* ============ HABITS ============ */
// Same storage key as the standalone tracker, so existing data carries over on this browser.
const HB_KEY = "habits_v1";
function hbLoad() { try { return JSON.parse(localStorage.getItem(HB_KEY)) || []; } catch (e) { return []; } }
function hbSave(h) { try { localStorage.setItem(HB_KEY, JSON.stringify(h)); } catch (e) {} }
let hbHabits = hbLoad();

function hbDayKey(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
const HB_TODAY = hbDayKey(new Date());
function hbDaysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return hbDayKey(d); }

function hbStreak(done) {
  const set = new Set(done);
  let streak = 0;
  let start = set.has(HB_TODAY) ? 0 : 1;
  if (start === 1 && !set.has(hbDaysAgo(1))) return 0;
  for (let i = start; i < 400; i++) {
    if (set.has(hbDaysAgo(i))) streak++; else break;
  }
  return streak;
}
function hbEscape(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function hbRender() {
  const list = document.getElementById("hb-list");
  const summary = document.getElementById("hb-summary");
  if (!hbHabits.length) {
    list.innerHTML = `<div class="empty">No habits yet.<br>Add one below to start a streak.</div>`;
    summary.textContent = "";
    return;
  }
  const doneToday = hbHabits.filter(h => h.done.includes(HB_TODAY)).length;
  summary.innerHTML = `<b>${doneToday}</b> of <b>${hbHabits.length}</b> done today`;
  list.innerHTML = hbHabits.map((h, idx) => {
    const isDone = h.done.includes(HB_TODAY);
    const streak = hbStreak(h.done);
    const doneSet = new Set(h.done);
    let cells = "";
    for (let i = 27; i >= 0; i--) {
      const k = hbDaysAgo(i);
      const cls = (doneSet.has(k) ? "on " : "") + (i === 0 ? "today" : "");
      cells += `<div class="cell ${cls}"></div>`;
    }
    return `
      <div class="habit">
        <div class="habit-top">
          <div class="check ${isDone ? "done" : ""}" data-hb-toggle="${idx}">✓</div>
          <div class="habit-info">
            <div class="habit-name">${hbEscape(h.name)}</div>
            <div class="habit-streak">
              ${streak > 0 ? `<span class="flame">🔥</span> ${streak}-day streak` : "No streak yet"}
            </div>
          </div>
          <button class="del" data-hb-del="${idx}" title="Delete">✕</button>
        </div>
        <div class="grid">${cells}</div>
        <div class="grid-label">Last 4 weeks</div>
      </div>`;
  }).join("");
}

document.getElementById("hb-list").addEventListener("click", e => {
  const toggle = e.target.closest("[data-hb-toggle]");
  const del = e.target.closest("[data-hb-del]");
  if (toggle) {
    const h = hbHabits[+toggle.dataset.hbToggle];
    const i = h.done.indexOf(HB_TODAY);
    if (i === -1) h.done.push(HB_TODAY); else h.done.splice(i, 1);
    hbSave(hbHabits); hbRender();
  } else if (del) {
    const h = hbHabits[+del.dataset.hbDel];
    if (confirm(`Delete "${h.name}"? Its history will be lost.`)) {
      hbHabits.splice(+del.dataset.hbDel, 1);
      hbSave(hbHabits); hbRender();
    }
  }
});
function hbAdd() {
  const input = document.getElementById("hb-new");
  const name = input.value.trim();
  if (!name) return;
  hbHabits.push({ name, done: [] });
  hbSave(hbHabits); input.value = ""; hbRender();
}
document.getElementById("hb-add").addEventListener("click", hbAdd);
document.getElementById("hb-new").addEventListener("keydown", e => { if (e.key === "Enter") hbAdd(); });
